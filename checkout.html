<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Random Shop</title>
    <link rel="stylesheet" href="shopstyle.css">
</head>
<body>
    <div class="header">
        <h1>Checkout</h1>
    </div>
    <form action="#" method="post">
        <h2>Shipping Information</h2>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required><br><br>
        
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required><br><br>
        
        <label for="zip">Zip Code:</label>
        <input type="text" id="zip" name="zip" required><br><br>
        
        <h2>Payment Information</h2>
        <label for="card">Card Number:</label>
        <input type="text" id="card" name="card" required><br><br>
        
        <label for="expiry">Expiry Date:</label>
        <input type="text" id="expiry" name="expiry" placeholder="MM/YY" required><br><br>
        
        <label for="cvv">CVV:</label>
        <input type="text" id="cvv" name="cvv" required><br><br>
        
        <button type="submit" class="buy-now">Complete Purchase</button>
    </form>
    <a href="randomshop.html">Back to Shop</a>
</body>
</html></content>
